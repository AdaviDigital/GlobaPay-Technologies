services:
  - type: web
    name: globapay-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # or free if your account supports Free web services
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: globapay-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: globapay-redis
          type: redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: redis
    name: globapay-redis
    plan: starter                # use a valid Redis plan
    ipAllowList:
    - source: 0.0.0.0/0
      description: Allow all          

databases:
  - name: globapay-postgres
    plan: basic-256mb      # lowercase